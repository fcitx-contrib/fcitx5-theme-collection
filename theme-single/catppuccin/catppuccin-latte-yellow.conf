[LightMode]
# 覆盖默认值
OverrideDefault=True
# 高亮颜色
HighlightColor=#df8e1d
# 悬停时高亮颜色
HighlightHoverColor=#df8e1d
# 高亮文本颜色
HighlightTextColor=#eff1f5
# 按下时高亮文本颜色
HighlightTextPressColor=#eff1f5
# 高亮标签颜色
HighlightLabelColor=#eff1f5
# 高亮注释颜色
HighlightCommentColor=#eff1f5
# 高亮标记颜色
HighlightMarkColor=#ffffff
# 面板颜色
PanelColor=#ccd0da
# 文本颜色
TextColor=#4c4f69
# 标签颜色
LabelColor=#4c4f69
# 注释颜色
CommentColor=#4c4f69
# 翻页按钮颜色
PagingButtonColor=#4c4f69
# 禁用的翻页按钮颜色
DisabledPagingButtonColor=#4c4f69
# 指示文本颜色
AuxColor=#4c4f69
# 光标前的预编辑颜色
PreeditColorPreCaret=#4c4f69
# 预编辑光标颜色
PreeditColorCaret=#4c4f69
# 光标后的预编辑颜色
PreeditColorPostCaret=#4c4f69
# 边框颜色
BorderColor=#7f7f7f
# 分隔线颜色
DividerColor=#7f7f7f

[DarkMode]
# 覆盖默认值
OverrideDefault=True
# 与浅色模式相同
SameWithLightMode=True

[Typography]
# 布局
Layout=Horizontal
# 书写模式
WritingMode="Horizontal top-bottom"
# 垂直时注释右对齐
VerticalCommentsAlignRight=False
# 翻页按钮样式
PagingButtonsStyle=Arrow

[Background]
# 图片
ImageUrl=
# 有图片时保留面板颜色
KeepPanelColorWhenHasImage=False
# 模糊
Blur=System
# 阴影
Shadow=True

[Font]
# 文本字号
TextFontSize=16
# 文本字重
TextFontWeight=400
# 标签字号
LabelFontSize=12
# 标签字重
LabelFontWeight=400
# 注释字号
CommentFontSize=12
# 注释字重
CommentFontWeight=400
# 预编辑字号
PreeditFontSize=16
# 预编辑字重
PreeditFontWeight=400

[Caret]
# 样式
Style=Blink
# 文本
Text=‸

[Highlight]
# 标记样式
MarkStyle=None
# 标记文本
MarkText=
# 悬停行为
HoverBehavior=Move

[Size]
# 覆盖默认值
OverrideDefault=True
# 边框宽度（px）
BorderWidth=1
# 边框半径（px）
BorderRadius=6
# 外边距（px）
Margin=0
# 高亮半径（px）
HighlightRadius=0
# 顶填充（px）
TopPadding=3
# 右填充（px）
RightPadding=7
# 底填充（px）
BottomPadding=3
# 左填充（px）
LeftPadding=7
# 标签、文本、注释间隔（px）
LabelTextGap=6
# 垂直时最小宽度（px）
VerticalMinWidth=200
# 卷轴单元格宽度 (px)
ScrollCellWidth=65
# 水平分隔线宽度（px）
HorizontalDividerWidth=1
